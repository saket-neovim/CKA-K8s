apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deploy-ns2
  name: deploy-ns2
  namespace: ns2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-ns2
  strategy: {}
  template:
    metadata:
      labels:
        app: deploy-ns2
    spec:
      containers:
      - image: nginx
        name: nginx
        resources: {}
status: {}

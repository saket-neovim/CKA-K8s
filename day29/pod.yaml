apiVersion: v1
kind: Pod
metadata:
  name: redis-pod
spec:
  volumes:
    - name: task-pv-storage
      persistentVolumeClaim:
        claimName: task-pv-claim
  containers:
   - image: nginx
     name: task-pv-container
     ports:
       - containerPort: 80
         name: "http-server"
     volumeMounts:
     - name: task-pv-storage
       mountPath: "/usr/share/nginx/html"
  nodeName: master

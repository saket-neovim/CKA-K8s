apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: app
  name: app
spec:
  containers:
  - image: nginx
    name: app
    volumeMounts:
      - name: data
        mountPath: /var/app/config
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes: 
   - name:  data
     persistentVolumeClaim:
       claimName: pvc-demo
